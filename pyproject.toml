[project]
name = "in-layers-secrets"
version = "1.1.1"
description = "The official secrets handling library for In Layers (Python). Part of the Node in Layers ecosystem."
authors = [
    {name = "Mike Cornwell",email = "mike@mikecornwell.com"}
]
license = {text = "GPLv3"}
readme = "README.md"
homepage = "https://github.com/node-in-layers/python-in-layers-secrets"
repository = "https://github.com/node-in-layers/python-in-layers-secrets"
keywords = ["layers", "python", "in-layers", "node", "domains", "secrets"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-box (>=7,<9)",
    "json5 (>=0.9.0,<1.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "in-layers-core (>=1.0.0,<2.0.0)"
]

[tool.poetry]
name = "in-layers-secrets"
version = "1.0.0"
description = ""
authors = []
packages = [
    { include = "in_layers", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.7.0",
    "isort>=5.12.0",
    "mypy>=1.12.0",
    "pytest>=8.0.0",
    "commitizen (>=3.13,<4.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "build (>=1.3.0,<2.0.0)",
    "twine (>=6.2.0,<7.0.0)",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
python-box = ">=7,<9"
json5 = ">=0.9.0,<1.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
in-layers-core = ">=1.0.0,<2.0.0"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
lines_after_imports = 2

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
  | \.mypy_cache
  | \.ruff_cache
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  ".mypy_cache",
  ".ruff_cache",
  "tests",
  "*/tests",
  "**/tests"
]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "B",
  "I",
  "UP",
  "N",
  "C90",
  "SIM",
  "S",
  "DTZ",
  "T20",
  "ARG",
  "PL",
  "RUF",
]
ignore = [
  "E501",
  "W291",
  "UP040",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "S101",
  "T201",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
  | \.mypy_cache
  | tmp
)/
'''

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
pythonpath = ["src"]
python_files = [
    "test_*.py",
    "*_test.py",
    "*-test.py",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
